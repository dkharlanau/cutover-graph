name: Publish Product Page

on:
  push:
    branches: [main]
    paths: ["docs/product.html", "docs/agent-manifest.json", ".github/workflows/product-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage product site
        run: |
          mkdir -p _site
          cp docs/product.html _site/index.html
          cp docs/agent-manifest.json _site/agent-manifest.json
          mkdir -p _site/demo
          python cutover_snapshot.py create examples/snapshots/before.json \
            --output /tmp/cutover-snapshot-before.json
          python control_room.py examples/snapshots/after.json \
            --previous-snapshot /tmp/cutover-snapshot-before.json \
            --observed-at 2026-08-30T23:00:00Z \
            --readiness-policy examples/readiness-policy.json \
            --json-output _site/demo/control-room.json \
            --markdown _site/demo/control-room.md \
            --html _site/demo/control-room.html \
            --title "Synthetic customer cutover — live control room"
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Add consent-aware portfolio analytics
        run: node scripts/inject-portfolio-analytics.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
