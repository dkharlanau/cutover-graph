[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cutover-graph"
version = "0.1.0"
description = "Deterministic cutover control room for dependencies, readiness, timing, contingencies, risk and verified evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dzmitryi Kharlanau" }]
keywords = [
  "cutover",
  "migration",
  "readiness",
  "control-room",
  "enterprise",
  "sap",
  "reconciliation",
  "risk",
  "evidence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://dkharlanau.github.io/cutover-graph/"
Repository = "https://github.com/dkharlanau/cutover-graph"
Issues = "https://github.com/dkharlanau/cutover-graph/issues"
Portfolio = "https://dkharlanau.github.io/products/"

[project.scripts]
cutover-graph = "cutover_cli:main"

[tool.setuptools]
py-modules = [
  "control_room",
  "control_room_verified",
  "cutover_artifacts",
  "cutover_cli",
  "cutover_contingency",
  "cutover_diff",
  "cutover_gate",
  "cutover_graph",
  "cutover_risk",
  "cutover_snapshot",
  "cutover_timing",
  "external_evidence",
]
